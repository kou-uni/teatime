<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>teatime — 議論の記録</title>
<style>
:root{color-scheme:light dark;--paper:#f4f1ea;--ink:#23201c;--muted:#6f6a60;--rule:#ded8c9;--red:#9b3b2f;--read:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;--ui:-apple-system,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#14130f;--ink:#e9e4d8;--muted:#948d80;--rule:#2e2a23;--red:#d08477}}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;letter-spacing:normal}
h1,p{margin:0}h1{font-family:var(--read);font-size:32px;font-weight:400;line-height:1.6}
a{color:inherit}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.page{width:100%;max-width:704px;min-height:100svh;margin:0 auto;padding:32px;display:flex;flex-direction:column}
.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--rule);color:var(--muted);font-size:12px}
.brand{color:var(--ink);font-size:24px;letter-spacing:.04em}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:16px;padding:32px 0}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}
.sub,.hint,#msg{font-size:14px;color:var(--muted);text-align:left;overflow-wrap:anywhere}
.sub{margin-top:8px}.hint{width:100%}
.state-rec,.state-busy,.state-done{display:none}
#go{display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:center;flex-shrink:0;width:176px;height:176px;border:0;border-radius:50%;background:var(--ink);color:var(--paper);font-size:22px}
#t{display:none;align-self:center;font-size:32px;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.5}
#msg:empty{display:none}
#x{display:none;align-self:flex-start;min-width:44px;min-height:44px;padding:8px 0;border:0;border-bottom:2px solid var(--ink);background:none;color:var(--ink);font-size:13px}
#x.arm{color:var(--red);border-bottom-color:var(--red)}
#prog{display:none;width:100%}
#prog .row{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 0 4px 8px;border-left:2px solid var(--rule);color:var(--muted);font-size:13px;line-height:1.5}
#prog .row>div:nth-child(2){order:0;flex:1;min-width:0;overflow-wrap:anywhere}
/* JS の記号を状態語に替える。 */
#prog .ic{order:1;flex:0 0 40px;font-size:0}
#prog .ic::after{content:"未着手";font-size:11px}
#prog .sec{order:2;flex:0 0 36px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#prog .row.done{color:var(--ink)}#prog .row.done .ic::after{content:"済み"}
#prog .row.run{border-left-color:var(--ink);color:var(--ink);font-weight:650}
#prog .row.run .ic::after{content:"作成中"}
#prog .row.fail{border-left-color:var(--red);color:var(--red)}#prog .row.fail .ic::after{content:"失敗"}
#prog .row.cancel .ic::after{content:"中止"}#prog .row.cancel>div:nth-child(2){text-decoration:line-through}
#found{display:none;font-size:12px;line-height:1.6;color:var(--muted);overflow-wrap:anywhere}
.links{display:none;flex-direction:column;align-items:flex-start;gap:16px}
a.primary,a.ghost{min-height:44px;min-width:44px;padding:8px 0;font-size:15px;font-weight:650;text-decoration:none}
a.primary{width:100%;padding:16px;background:var(--ink);color:var(--paper);text-align:center}
a.ghost{border-bottom:2px solid var(--ink)}
.foot{border-top:1px solid var(--rule);padding-top:8px;color:var(--muted);font-size:11px}
.foot a{display:inline-flex;align-items:center;min-height:44px;min-width:44px;font-size:13px;text-decoration:none;border-bottom:2px solid var(--ink)}
.foot p{margin-top:8px}
body[data-s=rec] .state-idle,body[data-s=busy] .state-idle{display:none}
body[data-s=rec] .state-rec,body[data-s=busy] .state-busy{display:block}
body[data-s=rec] #t{display:block}body[data-s=rec] #t:empty::before{content:"00:00"}
body[data-s=rec] #go::after{content:"";width:8px;height:8px;margin-top:16px;background:var(--paper);clip-path:circle(50%);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
body[data-s=rec] #x,body[data-s=busy] #x{display:block}
body[data-s=busy] .main{justify-content:flex-start;gap:8px;padding:16px 0}
body[data-s=busy] #go,body[data-s=busy] .hint{display:none}
body[data-s=busy] #x{order:5}
/* 既存 JS は完了後も idle。リンク表示を完了の目印にする。 */
body:is([data-s=done],[data-s=idle]:has(#links[style*="flex"])) .state-idle{display:none}
body:is([data-s=done],[data-s=idle]:has(#links[style*="flex"])) .state-done{display:block}
body:is([data-s=done],[data-s=idle]:has(#links[style*="flex"])) #prog,
body:is([data-s=done],[data-s=idle]:has(#links[style*="flex"])) .hint{display:none!important}
body:is([data-s=done],[data-s=idle]:has(#links[style*="flex"])) #go{order:6;width:96px;height:96px;font-size:16px}
body[data-s=done] #links{display:flex}
@media(max-width:640px){.page{padding:16px}h1{font-size:26px}.main{padding:32px 0}.eyebrow{margin-bottom:4px}}
@media(max-width:640px){body[data-s=busy] .masthead{padding-bottom:8px}body[data-s=busy] .main{gap:4px;padding:8px 0}body[data-s=busy] #prog .row{min-height:28px}body[data-s=busy] #found{font-size:11px}body[data-s=busy] .foot p{margin-top:4px}}
@media(prefers-reduced-motion:reduce){body[data-s=rec] #go::after{animation:none}}
</style>
</head>
<body data-s="idle">
<div class="page">
<header class="masthead"><span class="brand">teatime</span><span>茶の時間</span></header>
<main class="main">
<section class="intro">
<p class="eyebrow">議論の記録</p>
<h1><span class="state-idle">話す時間を、そのまま。</span><span class="state-rec">話を、続けてください。</span><span class="state-busy">形にしています。</span><span class="state-done">できました。</span></h1>
<p class="sub state-idle">タップで録音がはじまります。<br>スマホを机に置いて、お話しください。</p>
<p class="sub state-done">議論からできたものを、<br>ゆっくりご覧ください。</p>
</section>
<div id="t" aria-label="録音の経過時間"></div>
<button id="go" type="button">はじめる</button>
<p class="hint"><span class="state-idle">終わったら、もう一度タップ。</span><span class="state-rec">終わったら「おわる」を押して、席を外してください。</span></p>
<div id="msg" role="status" aria-live="polite"></div>
<button id="x" type="button">やめる（残さない）</button>
<div id="prog" aria-label="作成の工程"></div>
<div id="found" aria-label="ここまでに見つかったもの"></div>
<nav class="links" id="links" aria-label="できたもの">
<a class="primary" id="rep" href="#">できたものを見る</a>
<a class="ghost" id="proto" href="#">プロトタイプを触る</a>
</nav>
</main>
<footer class="foot"><a href="/archive">これまでの議論を見る</a><p>議論の記録だけから作ります。<br>記録に無いことは「未入力」と出ます。</p></footer>
</div>
<script>
let mr, chunks=[], t0, tick, stream;
const $=(i)=>document.getElementById(i), go=$('go'), msg=$('msg'), rep=$('rep');
const prog=$('prog'), found=$('found'), links=$('links'), proto=$('proto');
let t1=0, bump=null, jobId=null, quit=false, upload=null, arm=null;
const x=$('x');
const fmt=(s)=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

go.onclick = async () => {
  if (document.body.dataset.s === 'rec') return stop();
  if (document.body.dataset.s === 'busy') return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:true}});
  } catch (e) { msg.textContent = 'マイクが使えません（'+e.name+'）。HTTPS で開いているか確認してください。'; return; }
  chunks=[]; quit=false; jobId=null;
  links.style.display='none'; prog.style.display='none'; found.style.display='none';
  const mime = ['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  mr = new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = send;
  mr.start(4000);
  t0 = Date.now(); document.body.dataset.s='rec'; go.textContent='おわる';
  msg.textContent='録音中。画面は見なくて大丈夫です。';
  tick = setInterval(()=>$('t').textContent=fmt(Math.floor((Date.now()-t0)/1000)), 500);
};

function stop(){ clearInterval(tick); mr.stop(); stream.getTracks().forEach(t=>t.stop());
  document.body.dataset.s='busy'; go.textContent='お茶へ'; }

async function send(){
  const blob = new Blob(chunks, {type: mr.mimeType||'audio/mp4'});
  const ext = (mr.mimeType||'').includes('webm') ? 'webm' : 'm4a';
  msg.textContent='送っています…（'+Math.round(blob.size/1024)+'KB）';
  const fd = new FormData(); fd.append('audio', blob, 'rec.'+ext);
  let r;
  upload = new AbortController();
  try { r = await (await fetch('/upload', {method:'POST', body:fd, signal:upload.signal})).json(); }
  catch(e){ if (quit) return;
            msg.textContent='送れませんでした: '+e.message; document.body.dataset.s='idle';
            go.textContent='はじめる'; return; }
  jobId = r.id;
  if (quit) return cancelJob();  // 送っている最中にやめた。届いてしまった分を消す
  msg.textContent='お茶をどうぞ。席を外して大丈夫です。';
  prog.style.display='block'; t1=Date.now();
  bump=setInterval(()=>{const e=prog.querySelector('.row.run .sec');
    if(e) e.textContent=fmt(Math.floor((Date.now()-t1)/1000));}, 1000);
  poll(r.id);
}

let lastRun='';
function draw(steps){
  prog.innerHTML = steps.map(s=>{
    const ic = s.state==='done'?'✓' : s.state==='fail'?'!' : '';
    const sec = s.state==='done'&&s.sec ? fmt(s.sec) : '';
    return `<div class="row ${s.state}"><div class="ic">${ic}</div>`+
           `<div>${s.label}</div><div class="sec">${sec}</div></div>`;
  }).join('');
  const run = steps.find(s=>s.state==='run');
  if (run && run.key!==lastRun){ lastRun=run.key; t1=Date.now(); }
}

function drawFound(r){
  const bits=[];
  if (r.chars) bits.push('文字起こし '+r.chars+'字');
  if (r.topic) bits.push('主題: '+r.topic);
  if (r.abandonments!==undefined) bits.push('放棄点 '+r.abandonments+
    '（理由が言葉になっていない '+r.unverbalized+'）');
  if (r.gaps!==undefined) bits.push('埋めるべき空白 '+r.gaps);
  if (r.assumptions!==undefined) bits.push('仮置き '+r.assumptions);
  if (!bits.length) return;
  found.style.display='block'; found.innerHTML = bits.map(b=>'・'+b).join('<br>');
}

// 「やっぱやめる」。誤タップで議論を失わないよう、2回押したときだけ捨てる
x.onclick = () => {
  if (!arm){
    x.classList.add('arm');
    x.textContent = document.body.dataset.s==='rec'
      ? 'もう一度押すと、録音を捨てます' : 'もう一度押すと、この回を消します';
    arm = setTimeout(disarm, 3000); return;
  }
  disarm(); quit = true;
  if (document.body.dataset.s==='rec'){
    clearInterval(tick); mr.onstop=null; mr.stop(); stream.getTracks().forEach(t=>t.stop());
    chunks=[]; return reset('やめました。録音は送っていません。');
  }
  if (jobId) return cancelJob();
  if (upload) upload.abort();
  reset('やめました。');
};
function disarm(){ clearTimeout(arm); arm=null; x.classList.remove('arm');
  x.textContent='やめる（残さない）'; }
function reset(text){ clearInterval(bump); document.body.dataset.s='idle';
  go.textContent='はじめる'; $('t').textContent=''; msg.textContent=text; }
async function cancelJob(){
  reset('やめています。いま動いている1歩が終わったら、録音ごと消します。');
  try { await fetch('/cancel', {method:'POST', body:JSON.stringify({id:jobId})}); }
  catch(e){ msg.textContent='やめる合図が届きませんでした: '+e.message; return; }
  poll(jobId);
}

async function poll(id){
  if (id!==jobId) return;  // 次の回を始めたら、前の回は追わない
  let r; try { r = await (await fetch('/status?id='+id)).json(); }
  catch(e){ return setTimeout(()=>poll(id), 4000); }
  if (r.steps) draw(r.steps);
  drawFound(r);

  if (r.state === 'cancelled'){
    prog.style.display='none'; found.style.display='none';
    msg.textContent='やめました。録音も途中のものも消しました。'; return; }
  if (quit && r.state !== 'done' && r.state !== 'error')
    return setTimeout(()=>poll(id), 2000);
  if (r.state === 'done'){
    clearInterval(bump);
    msg.textContent='できました。';
    rep.href=r.url; proto.href=r.proto||'#';
    proto.style.display = r.proto ? 'block':'none';
    links.style.display='flex';
    document.body.dataset.s='idle'; go.textContent='もう一度'; $('t').textContent='';
    return;
  }
  if (r.state === 'error'){ clearInterval(bump);
    msg.textContent='しくじりました: '+r.error;
    document.body.dataset.s='idle'; go.textContent='はじめる'; return; }
  setTimeout(()=>poll(id), 2000);
}
</script></body></html>
